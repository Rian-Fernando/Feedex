name: Feature request
description: Suggest something Feedex should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Feedex makes hard or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried instead

  - type: checkboxes
    id: roadmap
    attributes:
      label: Roadmap
      options:
        - label: I checked docs/ROADMAP.md and this is not already planned
